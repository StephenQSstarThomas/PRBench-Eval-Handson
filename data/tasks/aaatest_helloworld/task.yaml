task_id: aaatest_helloworld

paper:
  title: "Hello World Test"
  author: "Test"
  doi: "N/A"
  year: 2024
  paper_file: "paper.md"

instruction_file: "instruction.md"
metadata_file: "metadata.md"
ground_truth_data_dir: "data"

expected_outputs:
  code:
    - "reproduction/hello.py"
  data:
    - "data/output.csv"

docker:
  image: "python:3.11-slim"
  memory_limit: "1g"
  timeout: 300
  pip_install: []

grading:
  dimensions:
    - name: "correctness"
      weight: 1.0
      description: >
        Does the script print 'hello world' and produce data/output.csv
        with a single row containing 1,1,1?

code_only:
  instruction_suffix: |
    ## Code-Only Mode
    Write the code only. Do NOT run it.
  expected_outputs:
    code:
      - "reproduction/hello.py"
  grading:
    dimensions:
      - name: "correctness"
        weight: 1.0
        description: >
          Does the code correctly print hello world and write a CSV with 1,1,1?
